name: Continuous Integration

on:
  push:
    branches:
      - main
    path-ignore:
      - "README.md"
      - "renovate.json"
  pull_request:

jobs:
  ci:
    runs-on: docker
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          install: true
          cache: true
          experimental: true
          minimum_release_age: 7d
          github_token: ${{secrets.MISE_GH_TOKEN}}
        env:
          MISE_GITHUB_TOKEN: ${{secrets.MISE_GH_TOKEN}}
      - name: Run tests
        run: mise test
          

