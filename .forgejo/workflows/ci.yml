name: Continuous Integration

on:
  push:
    branches:
      - main
    path-ignore:
      - "README.md"
      - "renovate.json"
  pull_request:

jobs:
  ci:
    runs-on: docker
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          install: true
          cache: true
          experimental: true
      - name: Run tests
        run: mise test
          

