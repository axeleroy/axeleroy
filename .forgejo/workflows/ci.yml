name: Continuous Integration

on:
  push:
    branches:
      - main
    path-ignore:
      - "README.md"
      - "renovate.json"
  pull_request:

jobs:
  ci:
    runs-on: docker
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: https://github.com/jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          install: true
          cache: true
          experimental: true
      - name: Run tests
        run: mise test
          

